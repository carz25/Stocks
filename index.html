      JPM: { symbol: "JPM", name: "JPMorgan Chase", price: 224.50, change: 1.60, percentChange: 0.72, high: 226.10, low: 222.80, open: 223.00, previousClose: 222.90, marketCap: "638B", peRatio: 12.8, high52: 229.80, low52: 140.20, volume: "7.9M", avgVolume: "9.8M", beta: 1.10, dividendYield: "2.14%", target1Yr: 245.00 },
      WMT: { symbol: "WMT", name: "Walmart Inc.", price: 82.50, change: 0.70, percentChange: 0.86, high: 83.10, low: 81.80, open: 81.90, previousClose: 81.80, marketCap: "662B", peRatio: 34.5, high52: 83.90, low52: 50.80, volume: "14.1M", avgVolume: "17.2M", beta: 0.52, dividendYield: "1.01%", target1Yr: 90.00 },
      LLY: { symbol: "LLY", name: "Eli Lilly", price: 920.40, change: 18.50, percentChange: 2.05, high: 928.00, low: 901.00, open: 905.00, previousClose: 901.90, marketCap: "874B", peRatio: 64.8, high52: 972.00, low52: 550.00, volume: "3.1M", avgVolume: "4.2M", beta: 0.45, dividendYield: "0.57%", target1Yr: 1020.00 },
      SPY: { symbol: "SPY", name: "SPDR S&P 500 ETF", price: 582.40, change: 3.10, percentChange: 0.54, high: 584.20, low: 580.10, open: 581.00, previousClose: 579.30, marketCap: "580B", peRatio: 27.5, high52: 587.00, low52: 430.00, volume: "45.2M", avgVolume: "58.0M", beta: 1.00, dividendYield: "1.22%", target1Yr: 615.00 }
    };

    // Dynamic AI Analysis Generator
    const getDynamicAISynthesis = (stock) => {
      const isPos = stock.change >= 0;
      const target = stock.target1Yr || stock.price * 1.12;
      const upsidePct = ((target - stock.price) / stock.price) * 100;
      
      let signal = "ACCUMULATE";
      let confidence = "88%";
      if (stock.percentChange > 2.5) {
        signal = "STRONG BUY";
        confidence = "94%";
      } else if (stock.percentChange < -1.5) {
        signal = "DIP BUY / HOLD";
        confidence = "79%";
      }

      return {
        signal,
        confidence,
        target,
        upsidePct,
        rationale: `${stock.name} (${stock.symbol}) displays strong momentum with price trading at $${stock.price.toFixed(2)}. Trailing P/E of ${stock.peRatio} reflects valuation support. Gemini AI models project a 12-month target of $${target.toFixed(2)} based on technical volume and market liquidity.`
      };
    };

    // Mini Sparkline SVG for Stock Movement
    const MiniSparkline = ({ change }) => {
      const isPos = change >= 0;
      const strokeColor = isPos ? "#10b981" : "#f43f5e";
      const points = isPos
        ? "0,22 15,18 30,20 45,12 60,14 75,6 90,8 100,2"
        : "0,4 15,8 30,6 45,16 60,12 75,22 90,20 100,26";

      return (
        <div className="w-24 h-7 inline-block align-middle">
          <svg viewBox="0 0 100 30" className="w-full h-full overflow-visible">
            <polyline
              fill="none"
              stroke={strokeColor}
              strokeWidth="2.5"
              strokeLinecap="round"
              strokeLinejoin="round"
              points={points}
            />
          </svg>
        </div>
      );
    };

    function App() {
      const [watchlist, setWatchlist] = useState(INITIAL_WATCHLIST);
      const [activeSymbol, setActiveSymbol] = useState(null);
      const [viewTab, setViewTab] = useState('grid'); // 'grid' | 'table' | 'heatmap'
      const [isLive, setIsLive] = useState(true);
      const [selectedInterval, setSelectedInterval] = useState('1D');
      
      // Configuration State
      const [showSettings, setShowSettings] = useState(false);
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('finnhub_api_key') || '');
      const [streamMode, setStreamMode] = useState('websocket'); // 'websocket' | 'rest' | 'fallback'
      const [logs, setLogs] = useState([`[SYSTEM] Real-time engine initialized`]);

      const wsRef = useRef(null);

      const addLog = (msg) => {
        const time = new Date().toLocaleTimeString();
        setLogs((prev) => [`[${time}] ${msg}`, ...prev.slice(0, 49)]);
      };

      // Real-time Engine Effect
      useEffect(() => {
        if (!isLive) return;

        if (streamMode === 'websocket' && apiKey) {
          addLog(`[CONNECTING] Connecting to Finnhub WebSocket stream...`);
          try {
            const socket = new WebSocket(`wss://ws.finnhub.io?token=${apiKey}`);
            wsRef.current = socket;

            socket.onopen = () => {
              addLog(`[WEBSOCKET OPEN] Connected successfully!`);
              Object.keys(watchlist).forEach((sym) => {
                socket.send(JSON.stringify({ type: 'subscribe', symbol: sym.toUpperCase() }));
              });
            };

            socket.onmessage = (event) => {
              try {
                const response = JSON.parse(event.data);
                if (response.type === 'trade' && response.data && response.data.length > 0) {
                  const trade = response.data[0];
                  const sym = trade.s ? trade.s.toUpperCase() : null;
                  const newPrice = parseFloat(trade.p.toFixed(2));

                  if (sym && watchlist[sym]) {
                    setWatchlist((prev) => {
                      const current = prev[sym];
                      if (!current) return prev;
                      const basePrice = current.previousClose || current.open;
                      const change = parseFloat((newPrice - basePrice).toFixed(2));
                      const percentChange = parseFloat(((change / basePrice) * 100).toFixed(2));
                      return {
                        ...prev,
                        [sym]: {
                          ...current,
                          price: newPrice,
                          change,
                          percentChange,
                          high: Math.max(current.high, newPrice),
                          low: Math.min(current.low, newPrice),
                          high52: Math.max(current.high52, newPrice),
                          low52: Math.min(current.low52, newPrice)
                        }
                      };
                    });
                    addLog(`[TICK] ${sym}: $${newPrice.toFixed(2)}`);
                  }
                }
              } catch (err) {
                console.error('Error parsing socket data:', err);
              }
            };

            socket.onerror = () => addLog(`[ERROR] WebSocket connection error.`);
            socket.onclose = () => addLog(`[CLOSED] WebSocket connection closed.`);

            return () => socket.close();
          } catch (err) {
            addLog(`[ERROR] Failed to establish socket: ${err.message}`);
          }
        } else if (streamMode === 'rest' && apiKey) {
          addLog(`[POLLING] Initiating REST polling engine...`);
          const key = apiKey;
          const interval = setInterval(async () => {
            const keys = Object.keys(watchlist);
            const randomBatch = keys.sort(() => 0.5 - Math.random()).slice(0, 4);

            for (const sym of randomBatch) {
              try {
                const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${key}`);
                if (res.ok) {
                  const data = await res.json();
                  if (data && data.c && data.c !== 0) {
                    const newPrice = parseFloat(data.c.toFixed(2));
                    setWatchlist((prev) => {
                      const curr = prev[sym];
                      if (!curr) return prev;
                      const prevClose = data.pc ? parseFloat(data.pc.toFixed(2)) : curr.previousClose;
                      const change = data.d ? parseFloat(data.d.toFixed(2)) : parseFloat((newPrice - prevClose).toFixed(2));
                      const percentChange = data.dp ? parseFloat(data.dp.toFixed(2)) : parseFloat(((change / prevClose) * 100).toFixed(2));
                      return {
                        ...prev,
                        [sym]: {
                          ...curr,
                          price: newPrice,
                          open: data.o ? parseFloat(data.o.toFixed(2)) : curr.open,
                          previousClose: prevClose,
                          change,
                          percentChange,
                          high: data.h ? parseFloat(data.h.toFixed(2)) : curr.high,
                          low: data.l ? parseFloat(data.l.toFixed(2)) : curr.low
                        }
                      };
                    });
                    addLog(`[REST TICK] ${sym}: $${newPrice.toFixed(2)} (${percentChange >= 0 ? '+' : ''}${percentChange.toFixed(2)}%)`);
                  }
                }
              } catch (err) {
                addLog(`[REST ERROR] Rate limit or network error for ${sym}`);
              }
            }
          }, 2000);

          return () => clearInterval(interval);
        } else {
          // Synthetic High-Frequency Fallback Stream (Bounded Realism)
          const interval = setInterval(() => {
            const keys = Object.keys(watchlist);
            const randomSym = keys[Math.floor(Math.random() * keys.length)];
            setWatchlist((prev) => {
              const curr = prev[randomSym];
              if (!curr) return prev;
              
              // Tight micro-tick delta (max 0.15% per tick)
              const maxDelta = curr.previousClose * 0.0015;
              const delta = (Math.random() - 0.49) * maxDelta;
              let newPrice = curr.price + delta;

              // Keep simulated price bounded within realistic intraday limits (±3.5% of previous close)
              const minAllowed = curr.previousClose * 0.965;
              const maxAllowed = curr.previousClose * 1.035;
              newPrice = Math.max(minAllowed, Math.min(maxAllowed, newPrice));
              newPrice = parseFloat(newPrice.toFixed(2));

              const basePrice = curr.previousClose || curr.open;
              const change = parseFloat((newPrice - basePrice).toFixed(2));
              const percentChange = parseFloat(((change / basePrice) * 100).toFixed(2));
              
              const newHigh = Math.max(curr.high, newPrice);
              const newLow = Math.min(curr.low, newPrice);

              return {
                ...prev,
                [randomSym]: {
                  ...curr,
                  price: newPrice,
                  change,
                  percentChange,
                  high: newHigh,
                  low: newLow,
                  high52: Math.max(curr.high52, newHigh),
                  low52: Math.min(curr.low52, newLow)
                }
              };
            });
          }, 1500);

          return () => clearInterval(interval);
        }
      }, [isLive, apiKey, streamMode]);

      const saveApiKey = () => {
        localStorage.setItem('finnhub_api_key', apiKey);
        addLog(`[CONFIG] Saved Finnhub API Key.`);
      };

      const testConnection = async () => {
        if (!apiKey) {
          addLog(`[TEST FAIL] No API key specified.`);
          return;
        }
        addLog(`[TESTING] Verifying key with Finnhub quote endpoint...`);
        try {
          const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=AAPL&token=${apiKey}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.c) {
              addLog(`[TEST SUCCESS] AAPL current price: $${data.c}`);
            } else {
              addLog(`[TEST WARNING] Connected but response invalid.`);
            }
          } else {
            addLog(`[TEST FAIL] HTTP ${res.status} - Key may be invalid.`);
          }
        } catch (err) {
          addLog(`[TEST ERROR] ${err.message}`);
        }
      };

      const activeStock = activeSymbol ? watchlist[activeSymbol] : null;
      const aiData = activeStock ? getDynamicAISynthesis(activeStock) : null;

      const filteredKeys = Object.keys(watchlist);

      // Dummy chart points generator
      const generateChartPoints = (price) => {
        const pts = [];
        let p = price * 0.96;
        for (let i = 0; i < 20; i++) {
          p += (Math.random() - 0.48) * (price * 0.008);
          pts.push({ price: parseFloat(p.toFixed(2)) });
        }
        pts.push({ price });
        return pts;
      };

      const chartData = activeStock ? generateChartPoints(activeStock.price) : [];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans p-4 sm:p-6 md:p-8">
          
          {/* HEADER BAR */}
          <header className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 pb-6 border-b border-slate-800">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-black text-xl font-mono">
                ⚡
              </div>
              <div>
                <h1 className="text-xl font-bold text-white tracking-tight">StockPulse Terminal</h1>
                <p className="text-xs text-slate-400">Real-Time Market Watch & AI Price Targets</p>
              </div>
            </div>

            {/* TAB NAVIGATION & CONFIG BUTTON */}
            <div className="flex items-center gap-2">
              <div className="flex bg-slate-900 border border-slate-800 p-1 rounded-xl">
                <button
                  onClick={() => setViewTab('grid')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    viewTab === 'grid' ? 'bg-cyan-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Watchlist Grid
                </button>
                <button
                  onClick={() => setViewTab('table')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    viewTab === 'table' ? 'bg-cyan-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Watchlist Table
                </button>
                <button
                  onClick={() => setViewTab('heatmap')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    viewTab === 'heatmap' ? 'bg-cyan-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Market Heatmap
                </button>
              </div>

              <button
                onClick={() => setShowSettings(true)}
                className="bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
              >
                <span>Configuration</span>
              </button>

              <button
                onClick={() => setIsLive(!isLive)}
                className={`px-3.5 py-2 rounded-xl text-xs font-semibold transition ${
                  isLive ? 'bg-emerald-500/20 border border-emerald-500/30 text-emerald-400' : 'bg-slate-900 text-slate-400'
                }`}
              >
                {isLive ? '● Live' : 'Paused'}
              </button>
            </div>
          </header>

          {/* CONFIGURATION MODAL */}
          {showSettings && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-2xl w-full space-y-6 shadow-2xl relative">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <h3 className="text-lg font-bold text-white">⚙️ Finnhub Connection & Diagnostics</h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white text-lg font-bold">✕</button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1 font-mono">Finnhub API Key</label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        placeholder="Paste your Finnhub token here..."
                        value={apiKey}
                        onChange={(e) => setApiKey(e.target.value)}
                        className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs font-mono text-white focus:outline-none focus:border-cyan-500"
                      />
                      <button
                        onClick={saveApiKey}
                        className="bg-cyan-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs hover:bg-cyan-400 transition"
                      >
                        Save Key
                      </button>
                      <button
                        onClick={testConnection}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-semibold transition"
                      >
                        Test Key
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-2 font-mono">Streaming Engine Mode</label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'websocket', label: 'WebSocket (1s Live)' },
                        { id: 'rest', label: 'REST Micro-Polling' },
                        { id: 'fallback', label: 'Synthetic Stream' }
                      ].map((m) => (
                        <button
                          key={m.id}
                          onClick={() => setStreamMode(m.id)}
                          className={`p-3 rounded-xl border text-xs font-mono font-semibold transition ${
                            streamMode === m.id
                              ? 'bg-cyan-500/20 border-cyan-500 text-cyan-400'
                              : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'
                          }`}
                        >
                          {m.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* DIAGNOSTICS LOG WINDOW */}
                  <div>
                    <div className="flex justify-between text-xs font-mono text-slate-400 mb-1">
                      <span>Connection Event Stream</span>
                      <button onClick={() => setLogs([])} className="hover:text-white">Clear Logs</button>
                    </div>
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 h-40 overflow-y-auto font-mono text-[11px] space-y-1">
                      {logs.map((log, idx) => (
                        <div key={idx} className={log.includes('ERROR') || log.includes('FAIL') ? 'text-rose-400' : log.includes('SUCCESS') || log.includes('OPEN') ? 'text-emerald-400' : 'text-slate-400'}>
                          {log}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="pt-2 text-right">
                  <button
                    onClick={() => setShowSettings(false)}
                    className="bg-slate-800 text-white font-bold px-5 py-2.5 rounded-xl text-xs hover:bg-slate-700 transition"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MAIN TERMINAL CONTAINER */}
          <main className="max-w-7xl mx-auto mt-6">
            
            {/* WATCHLIST VIEWS */}
            {!activeSymbol && (
              <div className="space-y-6">

                {/* VIEW TAB A: WATCHLIST GRID */}
                {viewTab === 'grid' && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    {filteredKeys.map((sym) => {
                      const s = watchlist[sym];
                      const isPos = s.change >= 0;
                      return (
                        <div
                          key={sym}
                          onClick={() => setActiveSymbol(sym)}
                          className="bg-slate-900/90 border border-slate-800/80 hover:border-cyan-500/40 rounded-2xl p-5 cursor-pointer transition hover:shadow-xl group flex flex-col justify-between"
                        >
                          <div>
                            <div className="flex items-center justify-between mb-2">
                              <span className="font-mono font-extrabold text-cyan-400 text-lg group-hover:scale-105 transition">{s.symbol}</span>
                              <span className="text-xs text-slate-400 truncate max-w-[120px] font-mono">{s.name}</span>
                            </div>

                            <div className="flex items-baseline justify-between my-3">
                              <span className="text-3xl font-black font-mono text-white">${s.price.toFixed(2)}</span>
                              <span className={`text-xl sm:text-3xl font-mono font-black ${isPos ? 'text-emerald-400' : 'text-rose-400'}`}>
                                {isPos ? '+' : ''}{s.percentChange.toFixed(2)}%
                              </span>
                            </div>
                          </div>

                          <div className="space-y-2 pt-3 border-t border-slate-800/80">
                            {/* TODAY'S DAY RANGE BAR */}
                            <div>
                              <div className="flex justify-between text-[10px] font-mono text-slate-400 mb-1">
                                <span>Day L: ${s.low}</span>
                                <span className="text-slate-300 font-semibold">Today's Range</span>
                                <span>Day H: ${s.high}</span>
                              </div>
                              <div className="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
                                <div 
                                  className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full"
                                  style={{ width: `${Math.min(100, Math.max(0, ((s.price - s.low) / ((s.high - s.low) || 1)) * 100))}%` }}
                                ></div>
                              </div>
                            </div>

                            {/* 52-WEEK RANGE BAR */}
                            <div>
                              <div className="flex justify-between text-[10px] font-mono text-slate-400 mb-1">
                                <span>52W L: ${s.low52}</span>
                                <span>52-Week Range</span>
                                <span>52W H: ${s.high52}</span>
                              </div>
                              <div className="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
                                <div 
                                  className="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 rounded-full"
                                  style={{ width: `${Math.min(100, Math.max(0, ((s.price - s.low52) / ((s.high52 - s.low52) || 1)) * 100))}%` }}
                                ></div>
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* VIEW TAB B: STREAMLINED WATCHLIST TABLE VIEW */}
                {viewTab === 'table' && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="border-b border-slate-800 text-base font-bold font-mono text-slate-200 bg-slate-950">
                            <th className="p-4 w-40 font-bold">Stock</th>
                            <th className="p-4 text-right font-bold">Price</th>
                            <th className="p-4 text-right font-bold">Day Change</th>
                            <th className="p-4 text-center font-bold">Today's Range</th>
                            <th className="p-4 text-center font-bold">Day's Movement</th>
                            <th className="p-4 text-right font-bold">Stock's P/E</th>
                            <th className="p-4 text-right font-bold">Dividend</th>
                            <th className="p-4 text-right font-bold">1-Yr Target</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60 text-base font-mono">
                          {filteredKeys.map((sym) => {
                            const s = watchlist[sym];
                            const isPos = s.change >= 0;
                            const dynamicAi = getDynamicAISynthesis(s);
                            const dayRangePct = Math.min(100, Math.max(0, ((s.price - s.low) / ((s.high - s.low) || 1)) * 100));
                            return (
                              <tr 
                                key={sym}
                                onClick={() => setActiveSymbol(sym)}
                                className="hover:bg-slate-800/60 transition cursor-pointer"
                              >
                                <td className="p-4 w-40">
                                  <div className="font-bold text-cyan-400 text-lg leading-tight">{s.symbol}</div>
                                  <div className="text-sm text-slate-400 font-normal truncate max-w-[140px] leading-snug">{s.name}</div>
                                </td>
                                <td className="p-4 text-right font-bold text-white text-lg">${s.price.toFixed(2)}</td>
                                <td className={`p-4 text-right font-black text-xl sm:text-2xl ${isPos ? 'text-emerald-400' : 'text-rose-400'}`}>
                                  {isPos ? '+' : ''}{s.percentChange.toFixed(2)}%
                                </td>
                                <td className="p-4 text-center w-48">
                                  <div className="space-y-1">
                                    <div className="flex justify-between text-[10px] text-slate-400">
                                      <span>${s.low}</span>
                                      <span>${s.high}</span>
                                    </div>
                                    <div className="w-full h-2 bg-slate-950 rounded-full overflow-hidden">
                                      <div 
                                        className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full"
                                        style={{ width: `${dayRangePct}%` }}
                                      ></div>
                                    </div>
                                  </div>
                                </td>
                                <td className="p-4 text-center w-36">
                                  <MiniSparkline change={s.change} />
                                </td>
                                <td className="p-4 text-right text-slate-200 text-base font-semibold">{s.peRatio}</td>
                                <td className="p-4 text-right text-slate-200 text-base font-semibold">{s.dividendYield}</td>
                                <td className="p-4 text-right font-bold text-emerald-400 text-lg">
                                  ${dynamicAi.target.toFixed(2)}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* VIEW TAB C: MARKET HEATMAP VIEW */}
                {viewTab === 'heatmap' && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3">
                      {filteredKeys.map((sym) => {
                        const s = watchlist[sym];
                        const isPos = s.change >= 0;
                        const absChange = Math.abs(s.percentChange);
                        
                        let spanClass = "col-span-1 row-span-1";
                        if (absChange >= 3.0) spanClass = "col-span-2 row-span-2";
                        else if (absChange >= 1.5) spanClass = "col-span-2 row-span-1";

                        let bgStyle = isPos 
                          ? (absChange >= 3.0 ? 'bg-emerald-600/90 hover:bg-emerald-500' : 'bg-emerald-900/60 hover:bg-emerald-800/80') 
                          : (absChange >= 3.0 ? 'bg-rose-600/90 hover:bg-rose-500' : 'bg-rose-900/60 hover:bg-rose-800/80');

                        return (
                          <div
                            key={sym}
                            onClick={() => setActiveSymbol(sym)}
                            className={`${spanClass} ${bgStyle} border border-white/10 rounded-xl p-4 cursor-pointer transition flex flex-col justify-between shadow-lg group`}
                          >
                            <div className="flex items-center justify-between">
                              <span className={`font-black font-mono text-white group-hover:scale-105 transition ${absChange >= 3.0 ? 'text-2xl' : 'text-base'}`}>
                                {s.symbol}
                              </span>
                              <span className="text-[10px] text-white/70 font-mono truncate max-w-[80px]">{s.name}</span>
                            </div>

                            <div>
                              <div className={`font-mono font-bold text-white ${absChange >= 3.0 ? 'text-xl sm:text-2xl' : 'text-sm'}`}>${s.price.toFixed(2)}</div>
                              <div className={`font-mono font-black ${absChange >= 3.0 ? 'text-xl sm:text-3xl' : 'text-base sm:text-xl'} ${isPos ? 'text-emerald-300' : 'text-rose-300'}`}>
                                {isPos ? '+' : ''}{s.percentChange.toFixed(2)}%
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

              </div>
            )}

            {/* VIEW 2: DETAILED SINGLE STOCK ANALYTICS */}
            {activeSymbol && activeStock && (
              <div className="space-y-6">

                {/* BACK BUTTON */}
                <button
                  onClick={() => setActiveSymbol(null)}
                  className="flex items-center gap-2 text-xs font-semibold text-slate-400 hover:text-white transition bg-slate-900 border border-slate-800 px-4 py-2.5 rounded-xl shadow-md"
                >
                  ← Back to Watchlist
                </button>

                {/* STOCK HERO BANNER */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <div className="flex items-center gap-3">
                        <h2 className="text-3xl font-black font-mono text-white">{activeStock.symbol}</h2>
                        <span className="text-slate-400 text-sm font-medium">{activeStock.name}</span>
                      </div>
                      <div className="flex items-baseline gap-4 pt-2">
                        <span className="text-5xl font-black font-mono text-white">${activeStock.price.toFixed(2)}</span>
                        <span className={`text-2xl sm:text-4xl font-mono font-black tracking-tight px-4 py-2 rounded-2xl ${
                          activeStock.change >= 0 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'
                        }`}>
                          {activeStock.change >= 0 ? '+' : ''}{activeStock.percentChange.toFixed(2)}%
                        </span>
                      </div>
                    </div>

                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-right">
                      <span className="text-xs text-slate-400 block font-mono">1-Year AI Target</span>
                      <span className="text-3xl font-black font-mono text-emerald-400">${aiData.target.toFixed(2)}</span>
                      <span className="text-xs text-emerald-400/80 block mt-0.5">({aiData.upsidePct >= 0 ? '+' : ''}{aiData.upsidePct.toFixed(2)}% Return)</span>
                    </div>
                  </div>
                </div>

                {/* DUAL RANGE CARDS */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <div className="flex justify-between text-xs font-mono text-slate-400 mb-2">
                      <span>Low: ${activeStock.low}</span>
                      <span className="text-white font-bold">Today's Range</span>
                      <span>High: ${activeStock.high}</span>
                    </div>
                    <div className="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden">
                      <div 
                        className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full"
                        style={{ width: `${Math.min(100, Math.max(0, ((activeStock.price - activeStock.low) / (activeStock.high - activeStock.low)) * 100))}%` }}
                      ></div>
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <div className="flex justify-between text-xs font-mono text-slate-400 mb-2">
                      <span>Low: ${activeStock.low52}</span>
                      <span className="text-white font-bold">52-Week Range</span>
                      <span>High: ${activeStock.high52}</span>
                    </div>
                    <div className="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden">
                      <div 
                        className="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 rounded-full"
                        style={{ width: `${Math.min(100, Math.max(0, ((activeStock.price - activeStock.low52) / (activeStock.high52 - activeStock.low52)) * 100))}%` }}
                      ></div>
                    </div>
                  </div>
                </div>

                {/* CHART WITH INTERVALS */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                  <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
                    <h3 className="text-lg font-bold text-white">Price Action Trajectory</h3>
                    <div className="flex flex-wrap items-center gap-1 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                      {['1D', '5D', '1W', '1M', '3M', '6M', 'YTD', '1Y', '5Y', '10Y'].map((interval) => (
                        <button
                          key={interval}
                          onClick={() => setSelectedInterval(interval)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-mono font-bold transition ${
                            selectedInterval === interval
                              ? 'bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/20'
                              : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          {interval}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="h-64 w-full flex items-end gap-1 pt-4 border-b border-slate-800">
                    {chartData.map((pt, idx) => {
                      const minPrice = Math.min(...chartData.map(d => d.price));
                      const maxPrice = Math.max(...chartData.map(d => d.price));
                      const heightPct = Math.max(10, ((pt.price - minPrice) / (maxPrice - minPrice || 1)) * 100);
                      return (
                        <div key={idx} className="flex-1 flex flex-col items-center group relative h-full justify-end">
                          <div 
                            className="w-full bg-cyan-500/30 group-hover:bg-cyan-400 rounded-t transition-all"
                            style={{ height: `${heightPct}%` }}
                          ></div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* KEY STATISTICS GRID */}
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                  {[
                    { label: 'Previous Close', value: `$${activeStock.previousClose}` },
                    { label: 'Open Price', value: `$${activeStock.open}` },
                    { label: 'Day Range', value: `$${activeStock.low} - $${activeStock.high}` },
                    { label: '52-Week Range', value: `$${activeStock.low52} - $${activeStock.high52}` },
                    { label: 'Market Cap', value: activeStock.marketCap },
                    { label: 'Volume', value: activeStock.volume },
                    { label: 'Avg Volume', value: activeStock.avgVolume },
                    { label: 'P/E Ratio', value: activeStock.peRatio },
                    { label: 'Dividend Yield', value: activeStock.dividendYield },
                    { label: 'Beta (5Y)', value: activeStock.beta },
                    { label: '1-Year Target', value: `$${aiData.target.toFixed(2)}` },
                    { label: 'Gemini Signal', value: aiData.signal }
                  ].map((stat, idx) => (
                    <div key={idx} className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
                      <span className="text-[11px] text-slate-400 block mb-1">{stat.label}</span>
                      <span className="text-sm font-mono font-bold text-white">{stat.value}</span>
                    </div>
                  ))}
                </div>

                {/* GEMINI AI RECOMMENDATION EXPLANATION & TARGET PREDICTION */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                    <div className="flex items-center justify-between mb-4">
                      <h3 className="text-lg font-bold text-white flex items-center gap-2">
                        🤖 Gemini AI Recommendation Rationale
                      </h3>
                      <span className="bg-cyan-500/20 text-cyan-400 font-mono text-xs px-3 py-1 rounded-full font-bold">
                        {aiData.signal} ({aiData.confidence})
                      </span>
                    </div>
                    <p className="text-sm text-slate-300 leading-relaxed bg-slate-950 p-4 rounded-2xl border border-slate-800">
                      {aiData.rationale}
                    </p>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                    <h3 className="text-lg font-bold text-white mb-4">🎯 1-Year Stock Price Target Prediction</h3>
                    <div className="space-y-4">
                      <div className="flex items-center justify-between bg-slate-950 p-4 rounded-2xl border border-slate-800">
                        <div>
                          <span className="text-xs text-slate-400 block">Predicted Price Target</span>
                          <span className="text-3xl font-black font-mono text-emerald-400">${aiData.target.toFixed(2)}</span>
                        </div>
                        <div className="text-right">
                          <span className="text-xs text-slate-400 block">Expected Return</span>
                          <span className="text-xl font-bold font-mono text-emerald-400">{aiData.upsidePct >= 0 ? '+' : ''}{aiData.upsidePct.toFixed(2)}%</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
