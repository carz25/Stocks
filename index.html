      NFLX: { symbol: "NFLX", name: "Netflix, Inc.", price: 760.10, change: 12.50, percentChange: 1.67, afterHoursPrice: 761.50, afterHoursChange: 1.40, afterHoursPercent: 0.18, high: 765.00, low: 748.20, open: 750.00, previousClose: 747.60, marketCap: "326B", peRatio: 42.1, high52: 773.00, low52: 423.00, volume: "3.2M", avgVolume: "4.5M", beta: 1.25, dividendYield: "0.00%", aiSignal: "BUY", aiConfidence: "85%", entryTarget: "$730.00 - $745.00", target1Yr: 840.00, target1YrUpside: 10.51, aiRationale: "Ad-supported subscription tiers are unlocking a broader total addressable market, complemented by strong global engagement metrics and expanding free cash flow conversion.", analysts: { consensus: 810.00, low: 650.00, high: 900.00, buy: 26, hold: 10, sell: 2 }, catalysts: ["Ad-tier subscriber expansion.", "Password sharing monetization."], risks: ["Content spend inflation.", "Streaming market saturation."] },
      PLTR: { symbol: "PLTR", name: "Palantir Technologies", price: 43.50, change: 1.80, percentChange: 4.32, afterHoursPrice: 43.85, afterHoursChange: 0.35, afterHoursPercent: 0.80, high: 44.20, low: 41.60, open: 42.00, previousClose: 41.70, marketCap: "97B", peRatio: 112.0, high52: 45.00, low52: 14.80, volume: "55.2M", avgVolume: "62.0M", beta: 2.75, dividendYield: "0.00%", aiSignal: "STRONG BUY", aiConfidence: "88%", entryTarget: "$38.00 - $41.00", target1Yr: 54.00, target1YrUpside: 24.14, aiRationale: "Unprecedented demand for Artificial Intelligence Platform (AIP) bootcamps is accelerating commercial revenue growth. Expanding enterprise deal size compensates for rich forward earnings multiples.", analysts: { consensus: 48.00, low: 22.00, high: 56.00, buy: 12, hold: 10, sell: 5 }, catalysts: ["Artificial Intelligence Platform (AIP) bootcamps.", "U.S. Commercial customer growth +50% Y/Y."], risks: ["High forward P/E valuation.", "Government contract lumpiness."] }
    };

    // Dynamic historical dataset builder supporting 10 timeframe intervals
    const generateDataForTimeframe = (interval, currentPrice) => {
      const configMap = {
        '1D': { count: 30, volatility: 0.002, trend: 0.0002 },
        '5D': { count: 35, volatility: 0.005, trend: 0.001 },
        '1W': { count: 35, volatility: 0.008, trend: 0.002 },
        '1M': { count: 40, volatility: 0.012, trend: 0.005 },
        '3M': { count: 45, volatility: 0.018, trend: 0.01 },
        '6M': { count: 50, volatility: 0.025, trend: 0.015 },
        'YTD': { count: 50, volatility: 0.022, trend: 0.012 },
        '1Y': { count: 55, volatility: 0.03, trend: 0.02 },
        '5Y': { count: 65, volatility: 0.05, trend: 0.04 },
        '10Y': { count: 80, volatility: 0.07, trend: 0.06 }
      };

      const cfg = configMap[interval] || configMap['1D'];
      const count = cfg.count;
      let startPrice = currentPrice;

      if (interval === '1D') startPrice = currentPrice * 0.995;
      else if (interval === '5D' || interval === '1W') startPrice = currentPrice * 0.97;
      else if (interval === '1M') startPrice = currentPrice * 0.94;
      else if (interval === '3M') startPrice = currentPrice * 0.90;
      else if (interval === '6M' || interval === 'YTD') startPrice = currentPrice * 0.86;
      else if (interval === '1Y') startPrice = currentPrice * 0.80;
      else if (interval === '5Y') startPrice = currentPrice * 0.45;
      else if (interval === '10Y') startPrice = currentPrice * 0.25;

      const data = [];
      let curr = startPrice;
      const now = new Date();

      for (let i = 0; i < count; i++) {
        const factor = (i / count);
        const randomDelta = (Math.random() - 0.47) * (currentPrice * cfg.volatility);
        curr = Math.max(5, curr + randomDelta + (factor * currentPrice * cfg.trend));

        let label = '';
        if (interval === '1D') {
          const d = new Date(now.getTime() - (count - i) * 12 * 60000);
          label = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else if (interval === '5D' || interval === '1W' || interval === '1M' || interval === '3M') {
          const d = new Date(now.getTime() - (count - i) * 24 * 3600000 * (interval === '3M' ? 2 : 1));
          label = `${d.getMonth() + 1}/${d.getDate()}`;
        } else {
          const d = new Date(now.getTime() - (count - i) * 30 * 24 * 3600000 * (interval === '10Y' ? 1.5 : 1));
          label = d.toLocaleDateString([], { month: 'short', year: '2-digit' });
        }

        data.push({
          time: label,
          price: parseFloat(curr.toFixed(2))
        });
      }
      data[data.length - 1].price = currentPrice;
      return data;
    };

    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('finnhub_api_key') || '');
      const [showSettings, setShowSettings] = useState(false);
      const [stocks, setStocks] = useState(INITIAL_WATCHLIST);
      const [activeSymbol, setActiveSymbol] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [mainTab, setMainTab] = useState('watchlist'); // 'watchlist' | 'heatmap'
      const [viewMode, setViewMode] = useState('grid'); // 'grid' | 'table'
      const [isLive, setIsLive] = useState(true);
      const [isApiConnected, setIsApiConnected] = useState(false);
      const [dataStreamMode, setDataStreamMode] = useState('websocket');
      const [flash, setFlash] = useState(null);
      const [chartInterval, setChartInterval] = useState('1D');
      const [chartData, setChartData] = useState([]);
      const [connectionLogs, setConnectionLogs] = useState([]);

      const addLog = (msg, type = 'info') => {
        const timestamp = new Date().toLocaleTimeString();
        setConnectionLogs(prev => [{ id: Math.random(), timestamp, msg, type }, ...prev.slice(0, 19)]);
      };

      const activeStock = activeSymbol && stocks[activeSymbol] ? stocks[activeSymbol] : null;

      // Dynamic AI Synthesis & 1-Year Prediction recalculator engine
      const getDynamicAISynthesis = (stock) => {
        if (!stock) return null;
        
        // Base targets and analyst benchmarks
        const currentPrice = stock.price;
        const consensus = stock.analysts ? stock.analysts.consensus : currentPrice * 1.15;
        const baselineUpside = stock.target1YrUpside || 15.0;

        // Price variation delta from baseline previous close
        const pctDelta = stock.percentChange || 0;
        
        // Dynamically compute adjusted target price and return expectation
        const dynamicTargetPrice = parseFloat((consensus * (1 + (pctDelta * 0.002))).toFixed(2));
        const dynamicUpside = parseFloat((((dynamicTargetPrice - currentPrice) / currentPrice) * 100).toFixed(2));
        
        // Dynamic rating and confidence based on price fluctuations and target gap
        let dynamicSignal = stock.aiSignal;
        let confidenceScore = parseInt(stock.aiConfidence) || 85;

        if (dynamicUpside > 25) {
          dynamicSignal = "STRONG BUY";
          confidenceScore = Math.min(96, confidenceScore + Math.floor(dynamicUpside / 5));
        } else if (dynamicUpside > 10) {
          dynamicSignal = "BUY";
        } else if (dynamicUpside > -5) {
          dynamicSignal = "HOLD";
        } else {
          dynamicSignal = "REDUCE / SELL";
        }

        // Dynamic rationale updated with real-time price trend context
        const momentumText = pctDelta >= 0 
          ? `Intraday bullish momentum (+${pctDelta.toFixed(2)}%) confirms structural strength.` 
          : `Recent price pullback (${pctDelta.toFixed(2)}%) creates an expanded margin of safety for long-term positions.`;

        const dynamicRationale = `${stock.aiRationale} ${momentumText} Current 12-month valuation models project target convergence around $${dynamicTargetPrice.toFixed(2)} (${dynamicUpside >= 0 ? '+' : ''}${dynamicUpside}% return potential).`;

        return {
          signal: dynamicSignal,
          confidence: `${confidenceScore}%`,
          target1Yr: dynamicTargetPrice,
          upside: dynamicUpside,
          rationale: dynamicRationale
        };
      };

      const dynamicAI = activeStock ? getDynamicAISynthesis(activeStock) : null;

      useEffect(() => {
        if (activeStock) {
          setChartData(generateDataForTimeframe(chartInterval, activeStock.price));
        }
      }, [activeSymbol, chartInterval]);

      const fetchInitialPrices = async (keyToUse) => {
        const k = keyToUse || apiKey || 'ctt9f49r01qhkca18j20ctt9f49r01qhkca18j2g';
        addLog(`Fetching initial real quote data for watchlist...`, 'info');
        
        const symbols = Object.keys(stocks);
        for (const sym of symbols) {
          try {
            const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${k}`);
            if (res.ok) {
              const data = await res.json();
              if (data && data.c && data.c !== 0) {
                setStocks(prev => {
                  if (!prev[sym]) return prev;
                  const cur = prev[sym];
                  const newPrice = parseFloat(data.c.toFixed(2));
                  const prevClose = data.pc ? parseFloat(data.pc.toFixed(2)) : cur.previousClose;
                  const change = parseFloat((newPrice - prevClose).toFixed(2));
                  const percentChange = parseFloat(((change / prevClose) * 100).toFixed(2));

                  return {
                    ...prev,
                    [sym]: {
                      ...cur,
                      price: newPrice,
                      change,
                      percentChange,
                      previousClose: prevClose,
                      high: data.h ? parseFloat(data.h.toFixed(2)) : cur.high,
                      low: data.l ? parseFloat(data.l.toFixed(2)) : cur.low,
                      open: data.o ? parseFloat(data.o.toFixed(2)) : cur.open
                    }
                  };
                });
              }
            }
          } catch(err) {
            // silent catch
          }
        }
        addLog(`Initial price hydration complete.`, 'success');
      };

      const saveApiKey = (key) => {
        const cleanedKey = key.trim();
        setApiKey(cleanedKey);
        localStorage.setItem('finnhub_api_key', cleanedKey);
        setDataStreamMode('websocket');
        addLog(`Saved API Key (${cleanedKey ? cleanedKey.substring(0, 6) + '...' : 'Default'}). Reconnecting...`, 'info');
        fetchInitialPrices(cleanedKey);
      };

      useEffect(() => {
        if (!isLive || dataStreamMode === 'fallback') return;
        const key = apiKey || 'ctt9f49r01qhkca18j20ctt9f49r01qhkca18j2g';
        let socket;

        addLog(`Initiating WebSocket connection to wss://ws.finnhub.io...`, 'info');

        try {
          socket = new WebSocket(`wss://ws.finnhub.io?token=${key}`);
          
          socket.onopen = () => {
            setIsApiConnected(true);
            addLog(`WebSocket connection established successfully!`, 'success');
            const syms = Object.keys(stocks);
            syms.forEach(sym => {
              socket.send(JSON.stringify({ type: 'subscribe', symbol: sym }));
            });
            addLog(`Subscribed to live updates for ${syms.length} tickers.`, 'info');
          };

          socket.onmessage = (event) => {
            const res = JSON.parse(event.data);
            if (res.type === 'trade' && res.data && res.data.length > 0) {
              const trade = res.data[0];
              const sym = trade.s;
              const newPrice = parseFloat(trade.p.toFixed(2));

              addLog(`[TICK] ${sym} @ $${newPrice.toFixed(2)} (${new Date(trade.t).toLocaleTimeString()})`, 'trade');

              setStocks(prev => {
                if (!prev[sym]) return prev;
                const cur = prev[sym];
                const change = parseFloat((newPrice - cur.previousClose).toFixed(2));
                const percentChange = parseFloat(((change / cur.previousClose) * 100).toFixed(2));
                const ahDelta = (newPrice * 0.0015);
                const ahPrice = parseFloat((newPrice + ahDelta).toFixed(2));
                const ahChange = parseFloat(ahDelta.toFixed(2));
                const ahPercent = parseFloat(((ahDelta / newPrice) * 100).toFixed(2));

                if (activeSymbol === sym && newPrice !== cur.price) {
                  setFlash(newPrice > cur.price ? 'up' : 'down');
                  setTimeout(() => setFlash(null), 400);

                  setChartData(cd => {
                    const next = cd.length > 0 ? [...cd.slice(1)] : [];
                    next.push({
                      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                      price: newPrice
                    });
                    return next;
                  });
                }

                return {
                  ...prev,
                  [sym]: { 
                    ...cur, 
                    price: newPrice, 
                    change, 
                    percentChange,
                    afterHoursPrice: ahPrice,
                    afterHoursChange: ahChange,
                    afterHoursPercent: ahPercent
                  }
                };
              });
            } else if (res.type === 'error') {
              addLog(`Finnhub Server Error: ${res.msg || 'Invalid API Token'}`, 'error');
            }
          };

          socket.onerror = (err) => {
            setIsApiConnected(false);
            addLog(`WebSocket error detected. Check your API key or network connection.`, 'error');
          };
          
          socket.onclose = () => {
            setIsApiConnected(false);
            addLog(`WebSocket connection closed. Switching to fallback stream...`, 'warn');
          };
        } catch(e) {
          setIsApiConnected(false);
          addLog(`Failed to connect WebSocket: ${e.message}`, 'error');
        }

        return () => { if (socket && socket.readyState === WebSocket.OPEN) socket.close(); };
      }, [isLive, apiKey, dataStreamMode]);

      useEffect(() => {
        if (!isLive || (dataStreamMode === 'websocket' && isApiConnected)) return;

        const interval = setInterval(() => {
          setStocks(prev => {
            const updated = { ...prev };
            const symbols = Object.keys(updated);
            const targetSym = symbols[Math.floor(Math.random() * symbols.length)];
            const cur = updated[targetSym];

            const delta = (Math.random() - 0.49) * (cur.price * 0.002);
            const newPrice = parseFloat(Math.max(10, cur.price + delta).toFixed(2));
            const change = parseFloat((newPrice - cur.previousClose).toFixed(2));
            const percentChange = parseFloat(((change / cur.previousClose) * 100).toFixed(2));

            const ahDelta = (newPrice * (Math.random() > 0.5 ? 0.0012 : -0.0008));
            const ahPrice = parseFloat((newPrice + ahDelta).toFixed(2));
            const ahChange = parseFloat(ahDelta.toFixed(2));
            const ahPercent = parseFloat(((ahDelta / newPrice) * 100).toFixed(2));

            if (activeSymbol === targetSym && newPrice !== cur.price) {
              setFlash(newPrice > cur.price ? 'up' : 'down');
              setTimeout(() => setFlash(null), 400);

              setChartData(cd => {
                const next = cd.length > 0 ? [...cd.slice(1)] : [];
                next.push({
                  time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                  price: newPrice
                });
                return next;
              });
            }

            updated[targetSym] = { 
              ...cur, 
              price: newPrice, 
              change, 
              percentChange,
              afterHoursPrice: ahPrice,
              afterHoursChange: ahChange,
              afterHoursPercent: ahPercent
            };
            return updated;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [isLive, dataStreamMode, isApiConnected, activeSymbol]);

      const filteredWatchlist = Object.values(stocks).filter(s => 
        s.symbol.toLowerCase().includes(searchQuery.toLowerCase()) ||
        s.name.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
          
          {/* HEADER */}

                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 text-xs font-mono">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">PREVIOUS CLOSE</span>
                    <span className="text-slate-200 font-bold">${activeStock.previousClose?.toFixed(2) || 'N/A'}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">OPEN</span>
                    <span className="text-slate-200 font-bold">${activeStock.open?.toFixed(2) || 'N/A'}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">DAY RANGE</span>
                    <span className="text-slate-200 font-bold">${activeStock.low} - ${activeStock.high}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">52-WEEK RANGE</span>
                    <span className="text-slate-200 font-bold">${activeStock.low52} - ${activeStock.high52}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">MARKET CAP</span>
                    <span className="text-cyan-400 font-bold">${activeStock.marketCap}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">P/E RATIO (TTM)</span>
                    <span className="text-slate-200 font-bold">{activeStock.peRatio}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">VOLUME</span>
                    <span className="text-slate-200 font-bold">{activeStock.volume}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">AVG VOLUME</span>
                    <span className="text-slate-200 font-bold">{activeStock.avgVolume}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">DIVIDEND YIELD</span>
                    <span className="text-slate-200 font-bold">{activeStock.dividendYield}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">BETA</span>
                    <span className="text-slate-200 font-bold">{activeStock.beta}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">1YR TARGET PRICE</span>
                    <span className="text-emerald-400 font-bold">${activeStock.target1Yr?.toFixed(2) || activeStock.analysts.consensus.toFixed(2)}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-slate-500 block text-[10px]">ENTRY ZONE</span>
                    <span className="text-cyan-400 font-bold">{activeStock.entryTarget}</span>
                  </div>
                </div>
              </div>

              {/* GEMINI RECOMMENDATION RATIONALE & 1-YEAR PREDICTION */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                {/* GEMINI EXPANDED RATIONALE */}
                <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h4 className="text-sm font-bold text-cyan-400 font-mono">Gemini AI Synthesis & Rationale</h4>
                      <p className="text-[11px] text-slate-400">Continuous live real-time rating model</p>
                    </div>
                    <span className="text-xs font-mono font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-2.5 py-1 rounded-lg">
                      Confidence: {dynamicAI?.confidence || activeStock.aiConfidence}
                    </span>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800/80 text-xs text-slate-300 leading-relaxed space-y-2">
                    <p className="font-semibold text-slate-200">Live Rating: <strong className="text-cyan-400">{dynamicAI?.signal || activeStock.aiSignal}</strong></p>
                    <p>{dynamicAI?.rationale || activeStock.aiRationale}</p>
                  </div>

                  <div className="space-y-2 text-xs">
                    <span className="text-slate-400 font-semibold uppercase tracking-wider block text-[10px] font-mono">Growth Catalysts</span>
                    {activeStock.catalysts.map((c, i) => (
                      <div key={i} className="bg-slate-950 p-2.5 rounded-lg border border-slate-800/60 text-slate-300 flex items-start gap-2">
                        <span className="text-cyan-400 font-bold">•</span>
                        <span>{c}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 1-YEAR PREDICTED TARGET PRICE */}
                <div className="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4">
                  <div>
                    <h4 className="text-sm font-bold text-emerald-400 font-mono">1-Year Stock Price Target Prediction</h4>
                    <p className="text-[11px] text-slate-400">12-Month Algorithmic Model Forecast</p>

                    <div className="my-5 bg-slate-950 p-4 rounded-xl border border-slate-800/80 text-center">
                      <span className="text-[10px] font-mono text-slate-400 uppercase tracking-wider block">PREDICTED TARGET PRICE</span>
                      <div className="text-4xl font-black font-mono text-emerald-400 my-1">
                        ${dynamicAI?.target1Yr?.toFixed(2) || activeStock.target1Yr?.toFixed(2)}
                      </div>
                      <span className={`text-xs font-mono font-bold ${(dynamicAI?.upside || 0) >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {(dynamicAI?.upside || 0) >= 0 ? '+' : ''}{dynamicAI?.upside || activeStock.target1YrUpside}% Expected Return
                      </span>
                    </div>

                    <div className="space-y-2 text-xs font-mono text-slate-400">
                      <div className="flex justify-between">
                        <span>Current Price:</span>
                        <strong className="text-slate-200">${activeStock.price.toFixed(2)}</strong>
                      </div>
                      <div className="flex justify-between">
                        <span>Wall St Consensus:</span>
                        <strong className="text-cyan-400">${activeStock.analysts.consensus.toFixed(2)}</strong>
                      </div>
                      <div className="flex justify-between">
                        <span>High Estimate:</span>
                        <strong className="text-emerald-400">${activeStock.analysts.high.toFixed(2)}</strong>
                      </div>
                      <div className="flex justify-between">
                        <span>Low Estimate:</span>
                        <strong className="text-rose-400">${activeStock.analysts.low.toFixed(2)}</strong>
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-800 text-[10px] font-mono text-slate-500 text-center">
                    Dynamically recalculated with every live price tick
                  </div>
                </div>

              </div>

            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
