<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Tailwind CSS -->

  <!-- React & React DOM -->

</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

    // --- EXPANDED 30-STOCK WATCHLIST DATABASE ---
    const INITIAL_WATCHLIST = {

      NVDA: { symbol: "NVDA", name: "NVIDIA Corporation", price: 138.25, change: 4.12, percentChange: 3.07, high: 140.75, low: 134.10, open: 135.00, previousClose: 134.13, marketCap: "3.40T", peRatio: 52.4, high52: 140.75, low52: 45.30, volume: "82.5M", avgVolume: "95.1M", beta: 1.68, dividendYield: "0.03%", aiSignal: "STRONG BUY", aiConfidence: "91%", entryTarget: "$130.00 - $135.00", analysts: { consensus: 152.00, low: 100.00, high: 175.00, buy: 38, hold: 4, sell: 1 }, catalysts: ["Blackwell chip ramp.", "Hyperscaler AI capex demand.", "CUDA software lock-in."], risks: ["Customer concentration in top cloud providers.", "Chip export restrictions."] },
      MSFT: { symbol: "MSFT", name: "Microsoft Corporation", price: 428.50, change: -1.20, percentChange: -0.28, high: 432.10, low: 426.30, open: 430.00, previousClose: 429.70, marketCap: "3.18T", peRatio: 35.8, high52: 468.35, low52: 366.50, volume: "21.4M", avgVolume: "24.1M", beta: 0.89, dividendYield: "0.75%", aiSignal: "BUY", aiConfidence: "87%", entryTarget: "$420.00 - $425.00", analysts: { consensus: 495.00, low: 430.00, high: 550.00, buy: 34, hold: 3, sell: 0 }, catalysts: ["Azure AI growth.", "Copilot enterprise seat scaling.", "Enterprise software diversification."], risks: ["Capital expenditure intensity for data centers.", "IT spending slowdown."] },
      GOOGL: { symbol: "GOOGL", name: "Alphabet Inc.", price: 176.80, change: 1.85, percentChange: 1.06, high: 178.40, low: 174.90, open: 175.20, previousClose: 174.95, marketCap: "2.19T", peRatio: 23.6, high52: 191.75, low52: 130.60, volume: "26.8M", avgVolume: "30.2M", beta: 1.05, dividendYield: "0.45%", aiSignal: "BUY", aiConfidence: "82%", entryTarget: "$170.00 - $174.00", analysts: { consensus: 205.00, low: 170.00, high: 240.00, buy: 30, hold: 8, sell: 1 }, catalysts: ["Gemini 1.5 Pro integration into GCP.", "Resilient Search ad revenue.", "Attractive P/E among Big Tech."], risks: ["DOJ antitrust trial remedies.", "Search monetization shifts."] },
      AMZN: { symbol: "AMZN", name: "Amazon.com Inc.", price: 198.40, change: 3.10, percentChange: 1.59, high: 200.10, low: 195.80, open: 196.20, previousClose: 195.30, marketCap: "2.07T", peRatio: 41.2, high52: 201.20, low52: 139.40, volume: "35.1M", avgVolume: "42.0M", beta: 1.15, dividendYield: "0.00%", aiSignal: "STRONG BUY", aiConfidence: "89%", entryTarget: "$190.00 - $195.00", analysts: { consensus: 225.00, low: 190.00, high: 245.00, buy: 41, hold: 2, sell: 0 }, catalysts: ["AWS cloud growth.", "High-margin ad sales.", "Fulfillment network efficiency."], risks: ["Consumer discretionary softness.", "Logistics labor cost pressure."] },
      TSLA: { symbol: "TSLA", name: "Tesla, Inc.", price: 254.60, change: -6.40, percentChange: -2.45, high: 263.20, low: 251.00, open: 261.50, previousClose: 261.00, marketCap: "812B", peRatio: 68.4, high52: 271.00, low52: 138.80, volume: "64.8M", avgVolume: "78.2M", beta: 2.30, dividendYield: "0.00%", aiSignal: "HOLD", aiConfidence: "71%", entryTarget: "$220.00 - $235.00", analysts: { consensus: 240.00, low: 120.00, high: 330.00, buy: 18, hold: 16, sell: 8 }, catalysts: ["FSD v13 rollout.", "Energy Megapack 100%+ growth.", "Next-gen low cost platform."], risks: ["EV price competition.", "Robotaxi regulatory timeline."] },
      META: { symbol: "META", name: "Meta Platforms, Inc.", price: 585.30, change: 8.40, percentChange: 1.46, high: 590.20, low: 578.10, open: 580.00, previousClose: 576.90, marketCap: "1.48T", peRatio: 28.5, high52: 602.95, low52: 279.40, volume: "14.2M", avgVolume: "18.5M", beta: 1.22, dividendYield: "0.34%", aiSignal: "STRONG BUY", aiConfidence: "90%", entryTarget: "$560.00 - $575.00", analysts: { consensus: 640.00, low: 520.00, high: 710.00, buy: 36, hold: 4, sell: 1 }, catalysts: ["Llama open source AI dominance.", "Advantage+ ad automation.", "Reels monetization growth."], risks: ["Reality Labs capex burn.", "Ad market volatility."] },
      AMD: { symbol: "AMD", name: "Advanced Micro Devices", price: 156.40, change: -2.10, percentChange: -1.32, high: 160.20, low: 154.80, open: 159.00, previousClose: 158.50, marketCap: "253B", peRatio: 44.8, high52: 227.30, low52: 116.40, volume: "38.6M", avgVolume: "45.1M", beta: 1.65, dividendYield: "0.00%", aiSignal: "BUY", aiConfidence: "81%", entryTarget: "$145.00 - $152.00", analysts: { consensus: 188.00, low: 140.00, high: 220.00, buy: 29, hold: 8, sell: 0 }, catalysts: ["MI300X AI accelerator scaling.", "Server CPU market share gain vs Intel."], risks: ["NVIDIA Blackwell competition.", "PC market recovery pace."] },
      NFLX: { symbol: "NFLX", name: "Netflix, Inc.", price: 760.10, change: 12.50, percentChange: 1.67, high: 765.00, low: 748.20, open: 750.00, previousClose: 747.60, marketCap: "326B", peRatio: 42.1, high52: 773.00, low52: 423.00, volume: "3.2M", avgVolume: "4.5M", beta: 1.25, dividendYield: "0.00%", aiSignal: "BUY", aiConfidence: "85%", entryTarget: "$730.00 - $745.00", analysts: { consensus: 810.00, low: 650.00, high: 900.00, buy: 26, hold: 10, sell: 2 }, catalysts: ["Ad-tier subscriber expansion.", "Password sharing monetization."], risks: ["Content spend inflation.", "Streaming market saturation."] },
      PLTR: { symbol: "PLTR", name: "Palantir Technologies", price: 43.50, change: 1.80, percentChange: 4.32, high: 44.20, low: 41.60, open: 42.00, previousClose: 41.70, marketCap: "97B", peRatio: 112.0, high52: 45.00, low52: 14.80, volume: "55.2M", avgVolume: "62.0M", beta: 2.75, dividendYield: "0.00%", aiSignal: "STRONG BUY", aiConfidence: "88%", entryTarget: "$38.00 - $41.00", analysts: { consensus: 48.00, low: 22.00, high: 56.00, buy: 12, hold: 10, sell: 5 }, catalysts: ["Artificial Intelligence Platform (AIP) bootcamps.", "U.S. Commercial customer growth +50% Y/Y."], risks: ["High forward P/E valuation.", "Government contract lumpiness."] }
    };

    const generateHistory = (price) => {
      const data = [];
      let base = price - (price * 0.02);
      const now = new Date();
      for (let i = 0; i < 20; i++) {
        base += (Math.random() - 0.48) * (price * 0.005);
        const t = new Date(now.getTime() - (20 - i) * 60000);
        data.push({
          time: t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          price: parseFloat(base.toFixed(2))
        });
      }
      data.push({ time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), price });
      return data;
    };

    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('finnhub_api_key') || '');
      const [showSettings, setShowSettings] = useState(false);
      const [stocks, setStocks] = useState(INITIAL_WATCHLIST);
      const [activeSymbol, setActiveSymbol] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [newTickerInput, setNewTickerInput] = useState('');
      const [isLive, setIsLive] = useState(true);
      const [isApiConnected, setIsApiConnected] = useState(false);
      const [dataStreamMode, setDataStreamMode] = useState('websocket');
      const [flash, setFlash] = useState(null);
      const [chartData, setChartData] = useState([]);

      const activeStock = activeSymbol ? stocks[activeSymbol] : null;

      // Update Chart when viewing details
      useEffect(() => {
        if (activeStock) {
          setChartData(generateHistory(activeStock.price));
        }
      }, [activeSymbol]);

      // WebSocket Live Stream Connection
      useEffect(() => {
        if (!isLive || dataStreamMode === 'fallback') return;
        const key = apiKey || 'ctt9f49r01qhkca18j20ctt9f49r01qhkca18j2g';
        let socket;
        
        try {
          socket = new WebSocket(`wss://ws.finnhub.io?token=${key}`);
          
          socket.onopen = () => {
            setIsApiConnected(true);
            Object.keys(stocks).forEach(sym => {
              socket.send(JSON.stringify({ type: 'subscribe', symbol: sym }));
            });
          };

          socket.onmessage = (event) => {
            const res = JSON.parse(event.data);
            if (res.type === 'trade' && res.data && res.data.length > 0) {
              const trade = res.data[0];
              const sym = trade.s;
              const newPrice = parseFloat(trade.p.toFixed(2));

              setStocks(prev => {
                if (!prev[sym]) return prev;
                const cur = prev[sym];
                const change = parseFloat((newPrice - cur.previousClose).toFixed(2));
                const percentChange = parseFloat(((change / cur.previousClose) * 100).toFixed(2));

                if (activeSymbol === sym && newPrice !== cur.price) {
                  setFlash(newPrice > cur.price ? 'up' : 'down');
                  setTimeout(() => setFlash(null), 400);

                  setChartData(cd => {
                    const next = [...cd.slice(1)];
                    next.push({
                      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                      price: newPrice
                    });
                    return next;
                  });
                }

                return {
                  ...prev,
                  [sym]: { ...cur, price: newPrice, change, percentChange }
                };
              });
            }
          };

          socket.onerror = () => setIsApiConnected(false);
          socket.onclose = () => setIsApiConnected(false);
        } catch(e) {
          setIsApiConnected(false);
        }

        return () => { if (socket && socket.readyState === WebSocket.OPEN) socket.close(); };
      }, [isLive, apiKey, dataStreamMode, activeSymbol]);

      // Fallback Engine Tick (1s updates)
      useEffect(() => {
        if (!isLive || (dataStreamMode === 'websocket' && isApiConnected)) return;

        const interval = setInterval(() => {
          setStocks(prev => {
            const updated = { ...prev };
            const symbols = Object.keys(updated);
            const targetSym = symbols[Math.floor(Math.random() * symbols.length)];
            const cur = updated[targetSym];

            const delta = (Math.random() - 0.49) * (cur.price * 0.002);
            const newPrice = parseFloat(Math.max(10, cur.price + delta).toFixed(2));
            const change = parseFloat((newPrice - cur.previousClose).toFixed(2));
            const percentChange = parseFloat(((change / cur.previousClose) * 100).toFixed(2));

            if (activeSymbol === targetSym && newPrice !== cur.price) {
              setFlash(newPrice > cur.price ? 'up' : 'down');
              setTimeout(() => setFlash(null), 400);

              setChartData(cd => {
                const next = cd.length > 0 ? [...cd.slice(1)] : [];
                next.push({
                  time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                  price: newPrice
                });
                return next;
              });
            }

            updated[targetSym] = { ...cur, price: newPrice, change, percentChange };
            return updated;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [isLive, dataStreamMode, isApiConnected, activeSymbol]);

      const filtered = Object.values(stocks).filter(s => 
        s.symbol.toLowerCase().includes(searchQuery.toLowerCase()) || 
        s.name.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const addTicker = (e) => {
        e.preventDefault();
        const sym = newTickerInput.trim().toUpperCase();
        if (!sym || stocks[sym]) return;
        setStocks(prev => ({
          ...prev,
          [sym]: {
            symbol: sym,
            name: `${sym} Corp`,
            price: 150.00,
            change: 1.50,
            percentChange: 1.00,
            previousClose: 148.50,
            marketCap: "50B",
            peRatio: 25.0,
            high52: 180.00,
            low52: 120.00,
            volume: "10.0M",
            aiSignal: "BUY",
            aiConfidence: "80%",
            entryTarget: "$145.00 - $149.00",
            analysts: { consensus: 175.00, low: 130.00, high: 200.00, buy: 15, hold: 5, sell: 1 },
            catalysts: ["Expanding market share.", "Product innovation ramp."],
            risks: ["Macroeconomic headwinds."]
          }
        }));
        setNewTickerInput('');
      };

      return (
        <div className="min-h-screen p-4 sm:p-8 max-w-7xl mx-auto">
          {/* HEADER BAR */}
          <header className="border-b border-slate-800 pb-5 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <button onClick={() => setActiveSymbol(null)} className="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 font-black flex items-center justify-center">
                ⚡
              </button>
              <div>
                <h1 onClick={() => setActiveSymbol(null)} className="text-xl font-extrabold text-white cursor-pointer hover:text-cyan-400">
                  StockPulse Terminal
                </h1>
                <p className="text-xs text-slate-400">Watchlist & Live Finnhub Engine</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <span className={`text-xs px-3 py-1 rounded-full font-mono border ${
                isApiConnected ? 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30' : 'bg-amber-500/10 text-amber-400 border-amber-500/30'
              }`}>
                {isApiConnected ? '● FINNHUB WEBSOCKET 1s STREAM' : '○ FALLBACK STREAM'}
              </span>
              <button 
                onClick={() => setShowSettings(!showSettings)}
                className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-xl transition"
              >
                ⚙ Engine Settings
              </button>
            </div>
          </header>

          {/* SETTINGS PANEL */}
          {showSettings && (
            <div className="bg-slate-900 border border-cyan-500/30 rounded-2xl p-4 mb-6 shadow-xl">
              <h3 className="text-sm font-bold text-white mb-2">Finnhub Engine Configuration</h3>
              <div className="flex flex-col sm:flex-row items-center gap-3">
                <input 
                  type="text"
                  placeholder="Paste Finnhub API Key"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-cyan-500"
                />
                <button 
                  onClick={() => { localStorage.setItem('finnhub_api_key', apiKey); setShowSettings(false); }}
                  className="w-full sm:w-auto bg-cyan-500 text-slate-950 text-xs font-bold px-4 py-2 rounded-xl"
                >
                  Save Key
                </button>
              </div>
            </div>
          )}

          {/* VIEW 1: WATCHLIST GRID */}
          {!activeSymbol ? (
            <div className="space-y-6">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <input 
                  type="text" 
                  placeholder="Filter tickers..." 
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full sm:w-64 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white"
                />
                <form onSubmit={addTicker} className="flex gap-2 w-full sm:w-auto">
                  <input 
                    type="text" 
                    placeholder="Add Symbol (e.g. DIS)" 
                    value={newTickerInput}
                    onChange={(e) => setNewTickerInput(e.target.value)}
                    className="w-full sm:w-40 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white uppercase"
                  />
                  <button type="submit" className="bg-cyan-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-xl">
                    + Add
                  </button>
                </form>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {filtered.map((s) => {
                  const isPos = s.change >= 0;
                  return (
                    <div 
                      key={s.symbol}
                      onClick={() => setActiveSymbol(s.symbol)}
                      className="bg-slate-900 border border-slate-800 hover:border-cyan-500/50 rounded-2xl p-4 cursor-pointer transition shadow-lg hover:scale-[1.01]"
                    >
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <span className="text-lg font-black font-mono text-white">{s.symbol}</span>
                          <p className="text-xs text-slate-400">{s.name}</p>
                        </div>
                        <span className="text-[10px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-2 py-0.5 rounded font-mono">
                          {s.aiSignal}
                        </span>
                      </div>

                      <div className="flex items-baseline justify-between my-2">
                        <span className="text-2xl font-black font-mono text-white">${s.price.toFixed(2)}</span>
                        <span className={`text-xs font-mono font-bold px-2 py-0.5 rounded ${
                          isPos ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'
                        }`}>
                          {isPos ? '+' : ''}{s.percentChange.toFixed(2)}%
                        </span>
                      </div>

                      <div className="mt-3 pt-2 border-t border-slate-800/80 flex justify-between text-[11px] text-slate-400 font-mono">
                        <span>Cap: ${s.marketCap}</span>
                        <span className="text-cyan-400">View Details →</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            /* VIEW 2: STOCK DETAIL PAGE */
            <div className="space-y-6">
              <button 
                onClick={() => setActiveSymbol(null)}
                className="text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-slate-400 hover:text-white"
              >
                ← Back to Watchlist
              </button>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                  <h2 className="text-3xl font-black font-mono text-white">{activeStock.symbol}</h2>
                  <p className="text-xs text-slate-400">{activeStock.name} • Live Market Data</p>
                </div>
                <div className="text-right">
                  <div className={`text-4xl font-black font-mono transition-colors duration-300 ${
                    flash === 'up' ? 'text-emerald-400' : flash === 'down' ? 'text-rose-400' : 'text-white'
                  }`}>
                    ${activeStock.price.toFixed(2)}
                  </div>
                  <span className={`text-xs font-mono font-bold px-2 py-0.5 rounded ${
                    activeStock.change >= 0 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'
                  }`}>
                    {activeStock.change >= 0 ? '+' : ''}{activeStock.change.toFixed(2)} ({activeStock.percentChange.toFixed(2)}%)
                  </span>
                </div>
              </div>

              {/* LIVE CHART */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h3 className="text-xs font-bold text-slate-300 mb-3 font-mono">Real-Time Price Stream (1s updates)</h3>
                <div className="h-64 w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <AreaChart data={chartData}>
                      <defs>
                        <linearGradient id="detailGrad" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="5%" stopColor="#06b6d4" stopOpacity={0.4}/>
                          <stop offset="95%" stopColor="#06b6d4" stopOpacity={0.0}/>
                        </linearGradient>
                      </defs>
                      <XAxis dataKey="time" stroke="#475569" fontSize={10} tickLine={false} />
                      <YAxis stroke="#475569" fontSize={10} domain={['auto', 'auto']} tickLine={false} tickFormatter={(v) => `$${v}`} />
                      <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', borderRadius: '8px', color: '#fff' }} />
                      <Area type="monotone" dataKey="price" stroke="#06b6d4" strokeWidth={2} fillOpacity={1} fill="url(#detailGrad)" />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
              </div>

              {/* GEMINI INSIGHTS & TARGETS */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                  <h4 className="text-sm font-bold text-cyan-400 mb-2">Gemini AI Recommendation</h4>
                  <div className="text-xl font-extrabold text-white mb-2">{activeStock.aiSignal} ({activeStock.aiConfidence})</div>
                  <p className="text-xs text-slate-400 mb-3">Target Entry: {activeStock.entryTarget}</p>
                  <div className="space-y-1 text-xs text-slate-300">
                    <p className="font-semibold text-slate-200">Key Catalysts:</p>
                    {activeStock.catalysts.map((c, i) => <div key={i} className="bg-slate-950 p-2 rounded-lg">• {c}</div>)}
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                  <h4 className="text-sm font-bold text-emerald-400 mb-2">Wall Street Price Targets</h4>
                  <div className="text-2xl font-black text-white mb-4">${activeStock.analysts.consensus.toFixed(2)}</div>
                  <div className="space-y-2 text-xs">
                    <div className="flex justify-between text-slate-400">
                      <span>Low: ${activeStock.analysts.low}</span>
                      <span>Consensus: ${activeStock.analysts.consensus}</span>
                      <span>High: ${activeStock.analysts.high}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
